    - data:
        code: "def main(query: str, retrieval_results: list) -> dict:\n    results\
          \ = retrieval_results or []\n\n    blocks = [f\"### 检索问题\\n{query}\"]\n\n\
          \    if not results:\n        blocks.append(\"### 检索结果\\n未召回相关知识库片段。\")\n\
          \        return {\n            \"single_retrieval_text\": \"\\n\".join(blocks)\n\
          \        }\n\n    blocks.append(\"### 检索结果\")\n\n    for idx, item in enumerate(results,\
          \ start=1):\n        if not isinstance(item, dict):\n            continue\n\
          \n        title = item.get(\"title\") or \"\"\n        content = item.get(\"\
          content\") or \"\"\n        metadata = item.get(\"metadata\") or {}\n\n\
          \        document_name = metadata.get(\"document_name\") or title\n    \
          \    score = metadata.get(\"score\", \"\")\n        segment_position = metadata.get(\"\
          segment_position\", \"\")\n        segment_id = metadata.get(\"segment_id\"\
          , \"\")\n\n        block = f\"\"\"[证据 {idx}]\nsource_doc: {document_name}\n\
          title: {title}\nscore: {score}\nsegment_position: {segment_position}\nsegment_id:\
          \ {segment_id}\ncontent:\n{content}\n\"\"\"\n        blocks.append(block)\n\
          \n    return {\n        \"single_retrieval_text\": \"\\n\\n\".join(blocks)\n\
          \    }"
        code_language: python3
        desc: Code，把单次检索结果转成文本
