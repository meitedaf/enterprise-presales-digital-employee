app:
  description: '模拟企业售前数字员工的核心工作流：将客户模糊需求结构化，基于企业知识库检索证据，评估产品能力匹配关系，生成可供售前人员审核的初版方案，并标记风险和人工确认项。


    该项目的定位不是直接替代售前人员做最终承诺，而是提升售前前期响应效率，降低资料查找、方案起草和能力边界遗漏的成本。'
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 企业售前数字员工
  use_icon_as_answer_icon: false
